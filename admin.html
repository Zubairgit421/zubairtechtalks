
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | ZUBAiR Tech Talks</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: #0b1020; color: #f4f7ff;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%; max-width: 410px; padding: 28px;
      border: 1px solid #26334b; border-radius: 18px;
      background: #121a2d;
    }
    h1 { font-size: 25px; margin: 0 0 8px; }
    p { color: #a7b2c9; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; }
    input {
      width: 100%; padding: 13px; border-radius: 8px;
      border: 1px solid #34435e; background: #0b1020;
      color: white; font-size: 15px;
    }
    button {
      width: 100%; margin-top: 20px; padding: 13px;
      border: 0; border-radius: 8px; background: #3984ff;
      color: white; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { overflow-wrap: anywhere; }
    a { color: #44d7e8; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>ZUBAiR Tech Talks</h1>
    <p>Admin Dashboard Login</p>

    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username"
             required placeholder="Enter your email">

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required
             placeholder="Enter your password">

      <button id="loginButton" type="submit">Login securely</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="./">← Back to website</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    if (!window.supabase || !window.SUPABASE_URL ||
        !window.SUPABASE_PUBLISHABLE_KEY ||
        window.SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {
      message.textContent = "Login configuration is incomplete. Please check the site setup.";
      button.disabled = true;
    } else {
      const client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
      );

      client.auth.getSession().then(({ data }) => {
        if (data.session) {
          window.location.replace("./dashboard.html");
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = "Signing in...";

        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) {
          message.textContent = "Login failed. Check your email, password and email confirmation.";
          button.disabled = false;
          return;
        }

        const { data: admin, error: adminError } = await client
          .from("admin_users")
          .select("user_id")
          .eq("user_id", data.user.id)
          .maybeSingle();

        if (adminError || !admin) {
          await client.auth.signOut();
          message.textContent = "This account is not authorized as an admin.";
          button.disabled = false;
          return;
        }

        window.location.href = "./dashboard.html";
      });
    }
  </script>
</body>
</html>
